name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Launcher test
        shell: bash
        run: bash tests/launcher-test.sh

  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The pin names a released cli
        run: bash tests/pin-test.sh
